name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_PRIMARY: "24"
  CORE_REF: "main"

jobs:
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: graphql-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fookiejs/core
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION_PRIMARY }}

      - name: build the linked core
        working-directory: core
        run: |
          npm ci
          npm run build

      - name: install
        working-directory: graphql-server
        run: npm ci

      - name: lint
        working-directory: graphql-server
        run: npm run lint
      - name: format
        working-directory: graphql-server
        run: npm run format:check
      - name: typecheck (src, must be clean)
        working-directory: graphql-server
        run: npm run typecheck
      - name: typecheck (src + tests)
        working-directory: graphql-server
        run: npm run typecheck:all
      - name: build
        working-directory: graphql-server
        run: npm run build

      - name: published package contains only dist
        working-directory: graphql-server
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "
            const files = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/pack.json','utf8'))[0].files.map(f => f.path);
            const stray = files.filter(f => f !== 'package.json' && f !== 'README.md' && f !== 'LICENSE' && f.startsWith('dist/') === false);
            if (stray.length > 0) { console.error('unexpected files in package tarball:', stray); process.exit(1); }
            console.log(files.length + ' files, all under dist/');
          "

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fookie_graphql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOKIE_TEST_DATABASE: postgres://postgres:postgres@localhost:5432/fookie_graphql_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: graphql-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fookiejs/core
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: build the linked core
        working-directory: core
        run: |
          npm ci
          npm run build

      - name: install
        working-directory: graphql-server
        run: npm ci

      - name: prove postgres is reachable
        working-directory: graphql-server
        run: |
          node -e '
            const pg = require("pg");
            const pool = new pg.Pool({ connectionString: process.env.FOOKIE_TEST_DATABASE });
            pool
              .query("select version()")
              .then((r) => { console.log(r.rows[0].version); return pool.end(); })
              .catch((e) => { console.error(e.message); process.exit(1); });
          '

      - name: run tests
        working-directory: graphql-server
        run: npm test

  invariants:
    name: house invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: no module grows past 600 lines
        env:
          KNOWN_DEBT: ""
        run: |
          status=0
          for f in $(find src -name '*.ts' | sort); do
            n=$(wc -l < "$f")
            case " $KNOWN_DEBT " in
              *" $f "*)
                echo "debt  $f ($n lines, exempt until decomposed)"
                continue
                ;;
            esac
            if [ "$n" -gt 600 ]; then
              echo "over  $f ($n lines > 600)"
              status=1
            fi
          done
          test "$status" -eq 0

      - name: graphql-js stays quarantined in the adapter
        run: |
          stray=$(grep -rln "from \"graphql\"" src | grep -v "^src/graphql-adapter/" || true)
          if [ -n "$stray" ]; then
            echo "graphql-js may only be touched inside src/graphql-adapter/, found in:"
            echo "$stray"
            exit 1
          fi
          echo "every graphql-js import sits behind the adapter"

      - name: reads go through model flows, never straight to SQL
        run: |
          if grep -rnE "\.sql\(|selectRows" src; then
            echo "a resolver reaching past the model flow would bypass authorization"
            exit 1
          fi
          echo "no resolver issues raw SQL"

      - name: report module sizes
        if: always()
        run: |
          {
            echo "### Module sizes"
            echo ''
            echo '| module | lines |'
            echo '| --- | --- |'
            find src -name '*.ts' -exec sh -c 'echo "| \`$1\` | $(wc -l < "$1") |"' _ {} \; | sort -t'|' -k3 -rn
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION_PRIMARY }}
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high
