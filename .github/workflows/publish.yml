name: Publish npm

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fookie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FOOKIE_TEST_DATABASE: postgres://postgres:postgres@localhost:5432/fookie_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gates ci.yml runs. main must never publish what CI would reject.
      - name: lint
        run: npm run lint
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck
      - name: typecheck (src plus tests)
        run: npm run typecheck:all
      - name: build
        run: npm run build
      - name: test
        run: npm test

      - name: published package contains only dist
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "
            const files = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/pack.json','utf8'))[0].files.map(f => f.path);
            const stray = files.filter(f => f !== 'package.json' && f !== 'README.md' && f !== 'LICENSE' && f.startsWith('dist/') === false);
            if (stray.length > 0) { console.error('unexpected files in package tarball:', stray); process.exit(1); }
            console.log(files.length + ' files, all under dist/');
          "

      # Releases are deliberate: package.json names the version, and republishing one
      # that already exists fails loudly instead of silently bumping past it.
      - name: read the version being released
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@fookiejs/graphql-server@$VERSION" version >/dev/null 2>&1; then
            echo "@fookiejs/graphql-server@$VERSION is already published; bump package.json first"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push --tags
